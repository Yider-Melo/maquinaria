<div class="page" *ngIf="!loading; else loadingTmpl">
  <h1>Panel de Administración</h1>
  <div class="stats-grid">
    <mat-card class="stat-card machinery" routerLink="/admin/machinery">
      <mat-icon>construction</mat-icon>
      <div class="stat-info">
        <span class="stat-value">{{ stats.machinery?.resumen?.activas || 0 }}</span>
        <span class="stat-label">Máquinas Activas</span>
        <span class="stat-sub">{{ stats.machinery?.resumen?.total || 0 }} registradas · {{ stats.machinery?.resumen?.tipos_distintos || 0 }} tipos</span>
      </div>
    </mat-card>
    <mat-card class="stat-card users" routerLink="/admin/users">
      <mat-icon>people</mat-icon>
      <div class="stat-info">
        <span class="stat-value">{{ stats.users?.total || 0 }}</span>
        <span class="stat-label">Usuarios</span>
        <span class="stat-sub">Registrados en la plataforma</span>
      </div>
    </mat-card>
  </div>
</div>
<ng-template #loadingTmpl><app-loading></app-loading></ng-template>
