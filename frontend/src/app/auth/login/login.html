<div class="auth-container">
  <mat-card>
    <mat-card-header><mat-card-title>Iniciar Sesión</mat-card-title></mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" [(ngModel)]="email" name="email" required>
        </mat-form-field>
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" [(ngModel)]="password" name="password" required>
        </mat-form-field>
        <p class="error" *ngIf="error">{{ error }}</p>
        <button mat-raised-button color="primary" type="submit" [disabled]="loading" class="full-width">
          {{ loading ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>
      <p class="link">¿No tienes cuenta? <a routerLink="/auth/register">Regístrate</a></p>
    </mat-card-content>
  </mat-card>
</div>
