<div class="auth-wrapper">
  <mat-card class="auth-card">
    <div class="auth-card-header">
      <mat-icon class="auth-icon">lock_outline</mat-icon>
      <h1>Iniciar Sesión</h1>
      <p>Accede a tu cuenta de RentaMaq</p>
    </div>
    <div class="auth-card-body">
      <form (ngSubmit)="onSubmit()">
        <div class="form-field">
          <mat-form-field appearance="outline" style="width:100%;">
            <mat-label>Email</mat-label>
            <input matInput type="email" [(ngModel)]="email" name="email" required placeholder="tu@email.com">
            <mat-icon matPrefix>email</mat-icon>
          </mat-form-field>
        </div>
        <div class="form-field">
          <mat-form-field appearance="outline" style="width:100%;">
            <mat-label>Contraseña</mat-label>
            <input matInput type="password" [(ngModel)]="password" name="password" required placeholder="••••••••">
            <mat-icon matPrefix>lock</mat-icon>
          </mat-form-field>
        </div>
        <div class="error-box" *ngIf="error">
          <mat-icon>error_outline</mat-icon>
          <span>{{ error }}</span>
        </div>
        <button mat-raised-button type="submit" [disabled]="loading" class="submit-btn">
          <mat-icon *ngIf="loading" style="animation:spin .8s linear infinite;">hourglass_top</mat-icon>
          {{ loading ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>
      <p class="auth-footer">¿No tienes cuenta? <a routerLink="/auth/register">Regístrate</a></p>
    </div>
  </mat-card>
</div>
