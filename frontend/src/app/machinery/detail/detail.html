<div class="container" *ngIf="!loading; else loadingTmpl">
  <button mat-button (click)="router.navigate(['/machinery'])">← Volver</button>
  <div class="detail-grid">
    <div class="images-section">
      <div class="main-image">
        <img [src]="images[0]?.url || 'favicon.ico'" alt="{{ item.titulo }}">
      </div>
      <div class="thumbnails" *ngIf="images.length > 0">
        <div *ngFor="let img of images" class="thumb">
          <img [src]="img.url">
          <button *ngIf="isOwner()" mat-icon-button class="remove-img" (click)="deleteImage(img.id)"><mat-icon>close</mat-icon></button>
        </div>
      </div>
      <div *ngIf="isOwner()" class="upload-section">
        <button mat-raised-button color="accent" (click)="fileInput.click()">
          <mat-icon>add_photo_alternate</mat-icon> Agregar Imagen
        </button>
        <input #fileInput type="file" accept="image/*" style="display:none" (change)="onFileSelected($event)">
      </div>
    </div>
    <div class="info">
      <h1>{{ item.titulo }}</h1>
      <p class="type">{{ item.tipo }} | {{ item.marca }} {{ item.modelo }} ({{ item.anio }})</p>
      <p>Estado: {{ item.estado }}</p>
      <p class="price">${{ item.precio_por_dia }} / día</p>
      <p *ngIf="item.precio_por_hora">${{ item.precio_por_hora }} / hora</p>
      <p class="location">{{ item.direccion }}, {{ item.ciudad }}, {{ item.departamento }}</p>
      <p class="desc">{{ item.descripcion }}</p>
      <div class="actions" *ngIf="auth.isLoggedIn()">
        <button *ngIf="!isOwner() && auth.esTipo('arrendatario')" mat-raised-button color="primary" [routerLink]="['/bookings']" [queryParams]="{machineryId:item.id}">Reservar</button>
        <button *ngIf="isOwner()" mat-raised-button color="accent" [routerLink]="['/machinery', item.id, 'edit']">Editar</button>
        <button *ngIf="isOwner()" mat-raised-button color="warn" (click)="deleteItem()">Eliminar</button>
      </div>
    </div>
  </div>
</div>
<ng-template #loadingTmpl><app-loading></app-loading></ng-template>
