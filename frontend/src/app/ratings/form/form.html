<h2 mat-dialog-title style="text-align:center;font-size:20px;">Calificar Experiencia</h2>
<mat-dialog-content>
  <p style="margin-bottom:4px;"><strong>Tu calificación</strong></p>
  <div class="star-preview" role="radiogroup" aria-label="Puntuación">
    <button
      type="button"
      *ngFor="let star of [1,2,3,4,5]; let i = index"
      class="star-btn"
      [class.filled]="star <= getDisplayRating()"
      [class.half]="star === getDisplayRating() && isHalfStar(getDisplayRating())"
      [class.empty]="star > getDisplayRating()"
      (click)="setRating(star)"
      (mouseenter)="hoverRating = star"
      (mouseleave)="hoverRating = -1"
      [attr.aria-label]="'Calificar con ' + star + ' estrellas'">
      <mat-icon>{{ getStarIcon(star) }}</mat-icon>
    </button>
  </div>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Comentario</mat-label>
    <textarea matInput [(ngModel)]="comentario" rows="4" placeholder="Cuéntanos tu experiencia..."></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end" style="padding:0 24px 16px;">
  <button mat-stroked-button (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="submit()">
    <mat-icon>send</mat-icon> Enviar
  </button>
</mat-dialog-actions>
