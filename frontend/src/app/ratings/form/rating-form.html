<h2 mat-dialog-title style="text-align:center;font-size:20px;">Calificar Experiencia</h2>
<mat-dialog-content>
  <div class="star-preview">{{ '★'.repeat(puntuacion) }}{{ '☆'.repeat(5 - puntuacion) }}</div>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Puntuación</mat-label>
    <mat-select [(ngModel)]="puntuacion">
      <mat-option [value]="1">1 - Muy malo</mat-option>
      <mat-option [value]="2">2 - Malo</mat-option>
      <mat-option [value]="3">3 - Regular</mat-option>
      <mat-option [value]="4">4 - Bueno</mat-option>
      <mat-option [value]="5">5 - Excelente</mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Comentario</mat-label>
    <textarea matInput [(ngModel)]="comentario" rows="4" placeholder="Cuéntanos tu experiencia..."></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end" style="padding:0 24px 16px;">
  <button mat-stroked-button (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="submit()">
    <mat-icon>send</mat-icon> Enviar
  </button>
</mat-dialog-actions>
