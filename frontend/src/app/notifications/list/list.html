<div class="container">
  <h1>Notificaciones</h1>
  <button mat-button color="primary" (click)="markAllAsRead()" *ngIf="notifications.length">Marcar todas leídas</button>
  <ng-container *ngIf="!loading; else loadingTmpl">
    <mat-card *ngFor="let n of notifications" class="card" [class.unread]="!n.leida" (click)="markAsRead(n.id)">
      <mat-card-header><mat-card-title>{{ n.titulo }}</mat-card-title><mat-card-subtitle>{{ n.creado_en | date:'medium' }}</mat-card-subtitle></mat-card-header>
      <mat-card-content><p>{{ n.mensaje }}</p></mat-card-content>
    </mat-card>
    <p *ngIf="notifications.length===0">Sin notificaciones.</p>
  </ng-container>
  <ng-template #loadingTmpl><app-loading></app-loading></ng-template>
</div>
