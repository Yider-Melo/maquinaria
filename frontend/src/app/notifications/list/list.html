<div class="container">
  <div class="page-header" appReveal>
    <h1>Notificaciones</h1>
    <button mat-stroked-button color="primary" class="mark-btn" (click)="markAllAsRead()" *ngIf="notifications.length">
      <mat-icon>done_all</mat-icon> Marcar todas leídas
    </button>
  </div>

  <ng-container *ngIf="!loading; else loadingTmpl">
    <mat-card *ngFor="let n of notifications; let i = index" class="notif-card" [class.unread]="!n.leida" matRipple appReveal [appReveal]="i * 60" (click)="goToNotification(n)">
      <mat-card-content style="padding:16px;">
        <div class="notif-header">
          <mat-icon class="notif-icon" [class]="getIconClase(n.tipo)">{{ getIcon(n.tipo) }}</mat-icon>
          <div style="flex:1;min-width:0;">
            <strong [style.color]="n.leida ? '#333' : '#000'">{{ n.titulo }}</strong>
          </div>
          <button mat-icon-button class="read-btn" *ngIf="!n.leida" (click)="$event.stopPropagation(); markAsRead(n.id)" title="Marcar como leída" aria-label="Marcar como leída">
            <mat-icon>mark_email_read</mat-icon>
          </button>
          <span class="notif-time">{{ formatDateRelative(n.creado_en) }}</span>
        </div>
        <p class="notif-mensaje">{{ n.mensaje }}</p>
        <div class="notif-tipo">{{ getTipoLabel(n.tipo) }}</div>
      </mat-card-content>
    </mat-card>
    <div class="pagination">
      <button mat-stroked-button (click)="prevPage()" [disabled]="page===1">Anterior</button>
      <span>Página {{ page }} de {{ totalPages }}</span>
      <button mat-stroked-button (click)="nextPage()" [disabled]="page*size>=total">Siguiente</button>
    </div>
    <div class="empty-state" *ngIf="notifications.length===0">
      <mat-icon>notifications_none</mat-icon>
      <p>No tienes notificaciones</p>
    </div>
  </ng-container>
  <ng-template #loadingTmpl><app-loading></app-loading></ng-template>
</div>
