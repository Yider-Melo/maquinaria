<div class="container">
  <div class="page-header">
    <h1>Notificaciones</h1>
    <button mat-stroked-button color="primary" class="mark-btn" (click)="markAllAsRead()" *ngIf="notifications.length">
      <mat-icon>done_all</mat-icon> Marcar todas leídas
    </button>
  </div>

  <ng-container *ngIf="!loading; else loadingTmpl">
    <mat-card *ngFor="let n of notifications" class="notif-card" [class.unread]="!n.leida" (click)="goToNotification(n)">
      <mat-card-content style="padding:16px;">
        <div class="notif-header">
          <mat-icon class="notif-icon" [class]="getIconClase(n.tipo)">{{ getIcon(n.tipo) }}</mat-icon>
          <div style="flex:1;min-width:0;">
            <strong [style.color]="n.leida ? '#333' : '#000'">{{ n.titulo }}</strong>
          </div>
          <span class="notif-time">{{ formatDateRelative(n.creado_en) }}</span>
        </div>
        <p class="notif-mensaje">{{ n.mensaje }}</p>
        <div class="notif-tipo">{{ getTipoLabel(n.tipo) }}</div>
      </mat-card-content>
    </mat-card>
    <div class="empty-state" *ngIf="notifications.length===0">
      <mat-icon>notifications_none</mat-icon>
      <p>No tienes notificaciones</p>
    </div>
  </ng-container>
  <ng-template #loadingTmpl><app-loading></app-loading></ng-template>
</div>
