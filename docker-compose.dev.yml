version: '3.8'

services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "4200:4200"
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --poll 2000"
    depends_on:
      - api-gateway
    networks:
      - rentamaq-network

volumes:
  frontend-node-modules:

networks:
  rentamaq-network:
    external: true
